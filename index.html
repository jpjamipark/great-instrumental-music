<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Great Instrumental Music - Craigslist Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>great instrumental music</h1>
    <p class="subtitle">craigslist washington dc / community</p>
    <p class="last-updated" id="last-updated"></p>
  </header>

  <main id="posts"></main>

  <script>
    async function loadPosts() {
      const res = await fetch('data/posts.json');
      const data = await res.json();
      const container = document.getElementById('posts');

      if (data.posts.length === 0) {
        container.innerHTML = '<p class="empty">No posts yet. Run the scraper first.</p>';
        return;
      }

      // Show last updated date (most recent last_seen)
      const lastUpdated = data.posts.reduce((latest, post) => {
        const postDate = new Date(post.last_seen);
        return postDate > latest ? postDate : latest;
      }, new Date(0));
      document.getElementById('last-updated').textContent =
        'last updated: ' + lastUpdated.toLocaleDateString('en-US', {
          year: 'numeric', month: 'short', day: 'numeric'
        });

      data.posts.forEach(post => {
        const card = document.createElement('article');
        card.className = 'post';

        const thumbnail = post.images.length > 0
          ? `<img src="${post.images[0]}" alt="" class="thumbnail">`
          : '<div class="no-image">no image</div>';

        const date = post.posted_date
          ? new Date(post.posted_date).toLocaleDateString()
          : 'no date';

        card.innerHTML = `
          <div class="post-header">
            ${thumbnail}
            <div class="post-info">
              <h2 class="post-title">${escapeHtml(post.title)}</h2>
              <p class="post-meta">
                <span class="location">${escapeHtml(post.location)}</span>
                <span class="date">${date}</span>
                <span class="price">${escapeHtml(post.price)}</span>
              </p>
            </div>
            <span class="toggle">+</span>
          </div>
          <div class="post-details">
            ${post.images.length > 0 ? `
              <div class="images">
                ${post.images.map(img => `<img src="${img}" alt="">`).join('')}
              </div>
            ` : ''}
            <div class="description">${linkify(post.description)}</div>
            <p class="post-link"><a href="${post.url}" target="_blank">view on craigslist</a></p>
            <p class="timestamps">
              first seen: ${new Date(post.first_seen).toLocaleString()}<br>
              last seen: ${new Date(post.last_seen).toLocaleString()}
            </p>
          </div>
        `;

        card.querySelector('.post-header').addEventListener('click', () => {
          card.classList.toggle('expanded');
          card.querySelector('.toggle').textContent = card.classList.contains('expanded') ? '−' : '+';
        });

        container.appendChild(card);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function linkify(text) {
      // First escape HTML, then convert URLs to links or embeds
      const escaped = escapeHtml(text);
      const urlPattern = /(https?:\/\/[^\s<]+)/g;

      return escaped.replace(urlPattern, (url) => {
        // YouTube video: youtu.be/ID
        const ytVideo = url.match(/youtu\.be\/([\w-]+)/);
        if (ytVideo) {
          return `<iframe width="640" height="360" src="https://www.youtube.com/embed/${ytVideo[1]}" frameborder="0" loading="lazy" allowfullscreen></iframe>`;
        }

        // YouTube playlist
        const ytPlaylist = url.match(/youtube\.com\/playlist\?list=([\w-]+)/);
        if (ytPlaylist) {
          return `<iframe width="640" height="360" src="https://www.youtube.com/embed/videoseries?list=${ytPlaylist[1]}" frameborder="0" loading="lazy" allowfullscreen></iframe>`;
        }

        // Regular link
        return `<a href="${url}" target="_blank">${url}</a>`;
      });
    }

    loadPosts();
  </script>
</body>
</html>
